<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYMO Label</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #d2d2d7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --ok: #2e7d32;
    --err: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1rem;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    color: var(--text);
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  .rich-input {
    width: 100%;
    min-height: 100px;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    color: var(--text);
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .rich-input:focus { border-color: var(--accent); }
  .rich-input:empty::before {
    content: attr(data-placeholder);
    color: #aaa;
  }
  .row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .row:last-child { margin-bottom: 0; }
  .row > label { margin: 0; flex-shrink: 0; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .checkbox-row label {
    margin: 0;
    color: var(--text);
    font-size: 1rem;
  }
  .preview-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fafafa;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 1rem;
    min-height: 120px;
    overflow: auto;
  }
  .preview-wrap img {
    max-width: 100%;
    height: auto;
    border: 1px solid #999;
    background: white;
  }
  .preview-meta {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
  button.primary {
    width: 100%;
    padding: 0.85rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: var(--muted); cursor: not-allowed; }
  .status {
    margin-top: 0.75rem;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .status.ok { display: block; background: #e8f5e9; color: var(--ok); }
  .status.err { display: block; background: #ffebee; color: var(--err); }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.6rem;
  }
  .seg-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg {
    background: white;
    border: none;
    padding: 0.45rem 0.7rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    min-width: 2.2rem;
  }
  .seg + .seg { border-left: 1px solid var(--border); }
  .seg.active { background: var(--accent); color: white; }
  .seg:hover:not(.active) { background: #f0f0f3; }
  .toggle-btn {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.45rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    min-width: 2.2rem;
  }
  .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .toggle-btn:hover:not(.active):not(:disabled) { background: #f0f0f3; }
  .toggle-btn:disabled { opacity: 0.4; cursor: default; }
  .size-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.6rem;
  }
  .size-row input[type="range"] { flex: 1; }
  .size-row .size-label {
    font-size: 0.85rem;
    color: var(--muted);
    min-width: 4rem;
    text-align: right;
  }
  @media (max-width: 480px) {
    body { padding: 0.5rem; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🏷️ DYMO Label</h1>

  <div class="card" id="printer_card">
    <label for="printer">Stampante</label>
    <select id="printer"></select>
  </div>

  <div class="card">
    <label for="format">Formato etichetta</label>
    <select id="format"></select>
  </div>

  <div class="card">
    <label for="text">Testo</label>
    <div id="text" class="rich-input" contenteditable="true"
         data-placeholder="Scrivi qui il testo dell'etichetta..."></div>

    <div class="toolbar">
      <button class="toggle-btn" id="bold_btn" title="Grassetto"><b>B</b></button>
      <button class="toggle-btn" id="italic_btn" title="Corsivo"><i>I</i></button>
      <div class="seg-group" id="align_group">
        <button class="seg" data-align="left" title="Allinea a sinistra" aria-label="Allinea a sinistra">
          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0"  width="16" height="1.5"/>
            <rect x="0" y="3"  width="10" height="1.5"/>
            <rect x="0" y="6"  width="14" height="1.5"/>
            <rect x="0" y="9"  width="7"  height="1.5"/>
          </svg>
        </button>
        <button class="seg active" data-align="center" title="Centra" aria-label="Centra">
          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0"  width="16" height="1.5"/>
            <rect x="3" y="3"  width="10" height="1.5"/>
            <rect x="1" y="6"  width="14" height="1.5"/>
            <rect x="4.5" y="9" width="7" height="1.5"/>
          </svg>
        </button>
        <button class="seg" data-align="right" title="Allinea a destra" aria-label="Allinea a destra">
          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0"  width="16" height="1.5"/>
            <rect x="6" y="3"  width="10" height="1.5"/>
            <rect x="2" y="6"  width="14" height="1.5"/>
            <rect x="9" y="9"  width="7" height="1.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="size-row">
      <label for="font_size" style="margin:0">Dim. font</label>
      <input type="range" id="font_size" min="0" max="200" step="2" value="0">
      <span class="size-label" id="font_size_label">Auto</span>
      <button class="toggle-btn" id="font_size_reset" title="Torna ad Auto" disabled>Auto</button>
    </div>

    <div class="checkbox-row" style="margin-top: 0.75rem;">
      <input type="checkbox" id="qr_enabled">
      <label for="qr_enabled">Aggiungi QR code</label>
    </div>
    <input type="text" id="qr_content" placeholder="Contenuto del QR (URL, testo...)" disabled>
    <select id="qr_position" disabled style="margin-top: 0.5rem;">
      <option value="left" selected>QR a sinistra (testo a destra)</option>
      <option value="right">QR a destra (testo a sinistra)</option>
      <option value="top">QR in alto (testo in basso)</option>
      <option value="bottom">QR in basso (testo in alto)</option>
    </select>
  </div>

  <div class="card">
    <label>Anteprima</label>
    <div class="preview-wrap">
      <img id="preview" alt="anteprima etichetta">
    </div>
    <div class="preview-meta" id="preview_meta"></div>
  </div>

  <div class="card">
    <button class="primary" id="print_btn">Stampa</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let formats = [];
let debounceTimer = null;

async function loadPrinters() {
  const res = await fetch('/api/printers');
  const printers = await res.json();
  const sel = $('printer');
  sel.innerHTML = '';
  if (printers.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = 'Nessuna stampante trovata';
    opt.disabled = true;
    sel.appendChild(opt);
    return;
  }
  printers.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name + (p.is_default ? ' (default)' : '');
    if (p.is_default) opt.selected = true;
    sel.appendChild(opt);
  });
  selectPrinterFor('label');
  // Hide the printer card when there's no real choice to make (1 or 2 DYMO
  // queues = the typical Pi case). Stays visible on 0 (error message) or 3+.
  $('printer_card').style.display =
    (printers.length >= 1 && printers.length <= 2) ? 'none' : '';
}

function selectPrinterFor(kind) {
  const sel = $('printer');
  const isTape = kind === 'tape';
  const match = [...sel.options].find(o => {
    if (!/dymo/i.test(o.value)) return false;
    return isTape ? /tape/i.test(o.value) : (/label/i.test(o.value) && !/tape/i.test(o.value));
  });
  if (match) sel.value = match.value;
}

async function loadFormats() {
  const res = await fetch('/api/formats');
  formats = await res.json();
  const sel = $('format');
  sel.innerHTML = '';
  formats.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.index;
    opt.textContent = f.name;
    if (f.is_default) opt.selected = true;
    sel.appendChild(opt);
  });
  // Trigger printer auto-selection for the (possibly default) preset
  const fmt = formats[parseInt(sel.value, 10)];
  if (fmt) selectPrinterFor(fmt.kind || 'label');
}

const state = { align: 'center' };

function extractRuns(root) {
  const runs = [];
  function pushNL() {
    if (runs.length && !runs[runs.length-1].text.endsWith('\n')) {
      runs.push({text: '\n', bold: false, italic: false});
    }
  }
  function walk(node, bold, italic, isFirstBlock) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (node.textContent) runs.push({text: node.textContent, bold, italic});
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName;
    if (tag === 'BR') {
      runs.push({text: '\n', bold, italic});
      return;
    }
    const isBlock = tag === 'DIV' || tag === 'P';
    const cs = node.style || {};
    const fw = (cs.fontWeight || '').toString();
    const fs = (cs.fontStyle || '').toString();
    const isB = bold  || tag === 'B' || tag === 'STRONG' || fw === 'bold' || parseInt(fw,10) >= 600;
    const isI = italic || tag === 'I' || tag === 'EM'    || fs === 'italic';

    if (isBlock && !isFirstBlock) pushNL();
    let firstChildBlock = true;
    for (const child of node.childNodes) {
      walk(child, isB, isI, firstChildBlock);
      firstChildBlock = false;
    }
  }
  let first = true;
  for (const child of root.childNodes) {
    walk(child, false, false, first);
    first = false;
  }
  // Compress adjacent runs with same style
  const out = [];
  for (const r of runs) {
    if (out.length && out[out.length-1].bold === r.bold && out[out.length-1].italic === r.italic) {
      out[out.length-1].text += r.text;
    } else {
      out.push({...r});
    }
  }
  return out;
}

function getPayload() {
  const sliderVal = parseInt($('font_size').value, 10);
  return {
    format: parseInt($('format').value, 10),
    runs: extractRuns($('text')),
    qr_enabled: $('qr_enabled').checked,
    qr_content: $('qr_content').value,
    qr_position: $('qr_position').value,
    align: state.align,
    font_size_pt: sliderVal > 0 ? sliderVal : null,
  };
}

function syncFormatButtons() {
  try {
    $('bold_btn').classList.toggle('active', document.queryCommandState('bold'));
    $('italic_btn').classList.toggle('active', document.queryCommandState('italic'));
  } catch (e) {}
}

async function updatePreview() {
  const payload = getPayload();
  const fmt = formats[payload.format];
  const media = fmt.cups_media || 'Custom.' + fmt.width_mm + 'x' + fmt.height_mm + 'mm';
  $('preview_meta').textContent = fmt.kind === 'tape'
    ? `Nastro ${fmt.width_mm} mm — lunghezza auto-fit — ${media}`
    : `${fmt.width_mm} × ${fmt.height_mm} mm — ${media}`;

  try {
    const res = await fetch('/api/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      console.error('Preview error', res.status);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const img = $('preview');
    const old = img.src;
    img.onload = () => { if (old.startsWith('blob:')) URL.revokeObjectURL(old); };
    img.src = url;
  } catch (e) {
    console.error('Preview fetch failed', e);
  }
}

function schedulePreview() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePreview, 300);
}

async function doPrint() {
  const btn = $('print_btn');
  const status = $('status');
  status.className = 'status';
  status.textContent = '';

  const payload = getPayload();
  payload.printer_name = $('printer').value;

  if (!payload.printer_name) {
    status.className = 'status err';
    status.textContent = 'Seleziona una stampante.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Stampa in corso...';
  try {
    const res = await fetch('/api/print', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.ok) {
      status.className = 'status ok';
      status.textContent = data.message || 'Job inviato a CUPS.';
    } else {
      status.className = 'status err';
      status.textContent = data.message || 'Errore di stampa.';
    }
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Errore di rete: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Stampa';
  }
}

// Wire up events
$('format').addEventListener('change', () => {
  const fmt = formats[parseInt($('format').value, 10)];
  if (fmt) selectPrinterFor(fmt.kind || 'label');
  schedulePreview();
});
$('text').addEventListener('input', () => { syncFormatButtons(); schedulePreview(); });
$('text').addEventListener('keyup', syncFormatButtons);
$('text').addEventListener('mouseup', syncFormatButtons);
document.addEventListener('selectionchange', () => {
  if (document.activeElement === $('text')) syncFormatButtons();
});
$('qr_enabled').addEventListener('change', () => {
  const on = $('qr_enabled').checked;
  $('qr_content').disabled = !on;
  $('qr_position').disabled = !on;
  schedulePreview();
});
$('qr_content').addEventListener('input', schedulePreview);
$('qr_position').addEventListener('change', schedulePreview);
$('print_btn').addEventListener('click', doPrint);

function applyFormat(cmd) {
  $('text').focus();
  document.execCommand(cmd, false, null);
  syncFormatButtons();
  schedulePreview();
}
$('bold_btn').addEventListener('mousedown', e => e.preventDefault());
$('italic_btn').addEventListener('mousedown', e => e.preventDefault());
$('bold_btn').addEventListener('click', () => applyFormat('bold'));
$('italic_btn').addEventListener('click', () => applyFormat('italic'));
$('align_group').querySelectorAll('.seg').forEach(btn => {
  btn.addEventListener('click', () => {
    state.align = btn.dataset.align;
    $('align_group').querySelectorAll('.seg').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    schedulePreview();
  });
});
function syncFontSizeUI() {
  const v = parseInt($('font_size').value, 10);
  $('font_size_label').textContent = v > 0 ? v + ' pt' : 'Auto';
  $('font_size_reset').disabled = v === 0;
}
$('font_size').addEventListener('input', () => {
  syncFontSizeUI();
  schedulePreview();
});
$('font_size_reset').addEventListener('click', () => {
  $('font_size').value = 0;
  syncFontSizeUI();
  schedulePreview();
});

// Init
(async () => {
  await Promise.all([loadPrinters(), loadFormats()]);
  $('text').textContent = 'Test';
  updatePreview();
})();
</script>
</body>
</html>
