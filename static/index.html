<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYMO Label</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #d2d2d7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --ok: #2e7d32;
    --err: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1rem;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 720px) 220px;
    gap: 1rem;
    max-width: 960px;
    margin: 0 auto;
  }
  .container { min-width: 0; }
  .history-sidebar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem;
    align-self: start;
    position: sticky;
    top: 1rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
  }
  .history-sidebar h2 {
    margin: 0 0 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .history-thumbs { display: flex; flex-direction: column; gap: 0.5rem; }
  .thumb {
    position: relative;
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    background: white;
    padding: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .thumb:hover { border-color: var(--accent); }
  .thumb.tape  { border-left-color: #ed8a00; }     /* arancio per nastri */
  .thumb.label { border-left-color: #6e6e73; }     /* grigio per etichette */
  .thumb img { display: block; width: 100%; height: auto; max-height: 80px; object-fit: contain; }
  .thumb-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .thumb-x {
    position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--border);
    cursor: pointer;
    display: none;
    line-height: 18px; text-align: center;
    color: var(--err); font-weight: bold; font-size: 14px;
    padding: 0;
  }
  .thumb:hover .thumb-x { display: block; }
  .see-all {
    display: block; margin-top: 0.5rem;
    color: var(--accent); text-decoration: none;
    font-size: 0.85rem; text-align: center;
  }
  .history-empty {
    color: var(--muted); font-size: 0.85rem;
    padding: 1rem 0; text-align: center;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; max-width: 720px; }
    .history-sidebar { position: static; max-height: none; }
    .history-thumbs {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .thumb { flex: 0 0 120px; }
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    line-height: 1.4;
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 960px;
    margin: 0 auto 1rem;
    gap: 1rem;
  }
  .page-tools {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .settings-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 1.4rem;
    line-height: 1;
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
  }
  .settings-link:hover { background: #ececef; color: var(--text); }
  .header-tools { display: flex; align-items: center; gap: 0.5rem; }
  .printer-dot {
    width: 0.7rem; height: 0.7rem; border-radius: 50%;
    background: #999;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
    transition: background 0.3s;
  }
  .printer-dot.online  { background: #2e7d32; }
  .printer-dot.offline { background: #c62828; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    color: var(--text);
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  .rich-input {
    width: 100%;
    min-height: 100px;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    color: var(--text);
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .rich-input:focus { border-color: var(--accent); }
  .rich-input:empty::before {
    content: attr(data-placeholder);
    color: #aaa;
  }
  .row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .row:last-child { margin-bottom: 0; }
  .row > label { margin: 0; flex-shrink: 0; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .checkbox-row label {
    margin: 0;
    color: var(--text);
    font-size: 1rem;
  }
  .preview-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fafafa;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 1rem;
    min-height: 120px;
    overflow: auto;
  }
  .preview-wrap img {
    max-width: 100%;
    height: auto;
    border: 1px solid #999;
    background: white;
  }
  .preview-meta {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
  button.primary {
    flex: 1;
    padding: 0.85rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: var(--muted); cursor: not-allowed; }
  button.secondary {
    padding: 0.85rem 1rem;
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  button.secondary:hover { background: #f0f0f3; }
  button.secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .action-row { display: flex; gap: 0.5rem; }
  .status {
    margin-top: 0.75rem;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .status.ok { display: block; background: #e8f5e9; color: var(--ok); }
  .status.err { display: block; background: #ffebee; color: var(--err); }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.6rem;
  }
  .seg-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg {
    background: white;
    border: none;
    padding: 0.45rem 0.7rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    min-width: 2.2rem;
  }
  .seg + .seg { border-left: 1px solid var(--border); }
  .seg.active { background: var(--accent); color: white; }
  .seg:hover:not(.active) { background: #f0f0f3; }
  .toggle-btn {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.45rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    min-width: 2.2rem;
  }
  .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .toggle-btn:hover:not(.active):not(:disabled) { background: #f0f0f3; }
  .toggle-btn:disabled { opacity: 0.4; cursor: default; }
  .decor-row { display: flex; align-items: center; }
  .icon-search-row {
    display: flex; gap: 0.4rem; align-items: stretch;
  }
  .icon-search-row input { flex: 1; }
  .icon-search-row select {
    width: auto; padding: 0.4rem 0.5rem;
    font-size: 0.9rem;
  }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 4px;
    margin-top: 0.5rem;
    max-height: 16rem;
    overflow-y: auto;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 4rem;
  }
  .icon-grid:empty::before {
    content: 'Digita per cercare…';
    color: #aaa;
    font-size: 0.85rem;
    grid-column: 1 / -1;
    text-align: center;
    align-self: center;
  }
  .icon-grid button {
    background: white;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 2px;
    overflow: hidden;
  }
  .icon-grid button:hover { background: #f0f0f3; }
  .icon-grid button.selected { border-color: var(--accent); background: #e8f0fe; }
  .icon-grid img { width: 32px; height: 32px; }
  .icon-grid .set {
    font-size: 0.62rem; color: var(--muted);
    width: 100%; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.1;
  }
  .size-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.6rem;
  }
  .size-row input[type="range"] { flex: 1; }
  .size-row .size-label {
    font-size: 0.85rem;
    color: var(--muted);
    min-width: 4rem;
    text-align: right;
  }
  @media (max-width: 480px) {
    body { padding: 0.5rem; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<header class="page-header">
  <h1>🏷️ DYMO Label</h1>
  <div class="page-tools">
    <span id="printer_dot" class="printer-dot" title="Stato stampante" aria-label="Stato stampante"></span>
    <a href="/presets" class="settings-link" title="Gestione preset" aria-label="Gestione preset">⚙</a>
  </div>
</header>
<div class="layout">
<div class="container">

  <div class="card" id="printer_card">
    <label for="printer">Stampante</label>
    <select id="printer"></select>
  </div>

  <div class="card">
    <label for="format">Formato etichetta</label>
    <select id="format"></select>
  </div>

  <div class="card">
    <label for="text">Testo</label>
    <div id="text" class="rich-input" contenteditable="true"
         data-placeholder="Scrivi qui il testo dell'etichetta..."></div>

    <div class="toolbar">
      <button class="toggle-btn" id="bold_btn" title="Grassetto"><b>B</b></button>
      <button class="toggle-btn" id="italic_btn" title="Corsivo"><i>I</i></button>
      <div class="seg-group" id="align_group">
        <button class="seg" data-align="left" title="Allinea a sinistra" aria-label="Allinea a sinistra">
          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0"  width="16" height="1.5"/>
            <rect x="0" y="3"  width="10" height="1.5"/>
            <rect x="0" y="6"  width="14" height="1.5"/>
            <rect x="0" y="9"  width="7"  height="1.5"/>
          </svg>
        </button>
        <button class="seg active" data-align="center" title="Centra" aria-label="Centra">
          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0"  width="16" height="1.5"/>
            <rect x="3" y="3"  width="10" height="1.5"/>
            <rect x="1" y="6"  width="14" height="1.5"/>
            <rect x="4.5" y="9" width="7" height="1.5"/>
          </svg>
        </button>
        <button class="seg" data-align="right" title="Allinea a destra" aria-label="Allinea a destra">
          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="0"  width="16" height="1.5"/>
            <rect x="6" y="3"  width="10" height="1.5"/>
            <rect x="2" y="6"  width="14" height="1.5"/>
            <rect x="9" y="9"  width="7" height="1.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="size-row">
      <label for="font_size" style="margin:0">Dim. font</label>
      <input type="range" id="font_size" min="0" max="200" step="2" value="0">
      <span class="size-label" id="font_size_label">Auto</span>
      <button class="toggle-btn" id="font_size_reset" title="Torna ad Auto" disabled>Auto</button>
    </div>

    <div class="size-row">
      <label for="line_spacing" style="margin:0">Interlinea</label>
      <input type="range" id="line_spacing" min="0" max="100" step="5" value="20">
      <span class="size-label" id="line_spacing_label">20%</span>
    </div>

    <div class="decor-row" style="margin-top: 0.9rem;">
      <label style="margin: 0 0.5rem 0 0">Decoro</label>
      <div class="seg-group" id="decor_mode">
        <button class="seg active" data-decor="none">Nessuno</button>
        <button class="seg"        data-decor="qr">QR</button>
        <button class="seg"        data-decor="icon">Icona</button>
      </div>
    </div>

    <div id="decor_qr" class="decor-pane" hidden style="margin-top: 0.6rem;">
      <input type="text" id="qr_content" placeholder="Contenuto del QR (URL, testo...)">
    </div>

    <div id="decor_icon" class="decor-pane" hidden style="margin-top: 0.6rem;">
      <div class="icon-search-row">
        <input type="text" id="icon_search" placeholder="Cerca un'icona (es. 'home', 'wifi'...)">
        <select id="icon_set_filter" title="Filtra per set">
          <option value="">Tutti i set</option>
        </select>
      </div>
      <div id="icon_results" class="icon-grid"></div>
      <div id="icon_chosen" hidden style="margin-top: 0.4rem; font-size: 0.85rem; color: var(--muted);">
        <span>Scelta:</span> <strong id="icon_chosen_id"></strong>
      </div>
    </div>

    <select id="decor_position" hidden style="margin-top: 0.6rem;">
      <option value="left" selected>A sinistra (testo a destra)</option>
      <option value="right">A destra (testo a sinistra)</option>
      <option value="top">In alto (testo in basso)</option>
      <option value="bottom">In basso (testo in alto)</option>
    </select>
  </div>

  <div class="card">
    <label>Anteprima</label>
    <div class="preview-wrap">
      <img id="preview" alt="anteprima etichetta">
    </div>
    <div class="preview-meta" id="preview_meta"></div>
  </div>

  <div class="card">
    <div class="action-row">
      <button class="secondary" id="reset_btn" title="Cancella editor e cursori">Reset</button>
      <button class="primary" id="print_btn">Stampa</button>
      <button class="secondary" id="draft_btn" title="Salva nella cronologia senza stampare">Salva bozza</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<aside class="history-sidebar" id="history_sidebar">
  <h2>Recenti</h2>
  <div class="history-thumbs" id="history_thumbs"></div>
  <a href="/history" class="see-all">Vedi tutto →</a>
</aside>
</div>

<script>
const $ = id => document.getElementById(id);
let formats = [];
let debounceTimer = null;

async function loadPrinters() {
  let printers = [];
  try {
    const res = await fetch('/api/printers');
    printers = await res.json();
  } catch (e) {
    printers = [];
  }
  updatePrinterDot(printers);
  const sel = $('printer');
  sel.innerHTML = '';
  if (printers.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = 'Nessuna stampante trovata';
    opt.disabled = true;
    sel.appendChild(opt);
    return;
  }
  printers.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name + (p.is_default ? ' (default)' : '');
    if (p.is_default) opt.selected = true;
    sel.appendChild(opt);
  });
  selectPrinterFor('label');
  // Hide the printer card when there's no real choice to make (1 or 2 DYMO
  // queues = the typical Pi case). Stays visible on 0 (error message) or 3+.
  $('printer_card').style.display =
    (printers.length >= 1 && printers.length <= 2) ? 'none' : '';
}

function updatePrinterDot(printers) {
  const dot = $('printer_dot');
  if (!dot) return;
  const dymoCount = printers.filter(p => /dymo/i.test(p.name)).length;
  if (dymoCount > 0) {
    dot.classList.add('online');
    dot.classList.remove('offline');
    dot.title = `${dymoCount} stampante DYMO online`;
  } else {
    dot.classList.add('offline');
    dot.classList.remove('online');
    dot.title = 'Nessuna stampante DYMO rilevata';
  }
}

// Refresh printer status periodically (silent — no full UI re-render)
async function refreshPrinterStatus() {
  try {
    const res = await fetch('/api/printers');
    updatePrinterDot(await res.json());
  } catch (e) { updatePrinterDot([]); }
}
setInterval(refreshPrinterStatus, 30000);

function selectPrinterFor(kind) {
  const sel = $('printer');
  const isTape = kind === 'tape';
  const match = [...sel.options].find(o => {
    if (!/dymo/i.test(o.value)) return false;
    return isTape ? /tape/i.test(o.value) : (/label/i.test(o.value) && !/tape/i.test(o.value));
  });
  if (match) sel.value = match.value;
}

async function loadFormats() {
  const res = await fetch('/api/formats');
  formats = await res.json();
  const sel = $('format');
  sel.innerHTML = '';
  formats.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.index;
    opt.textContent = f.name;
    if (f.is_default) opt.selected = true;
    sel.appendChild(opt);
  });
  // Trigger printer auto-selection for the (possibly default) preset
  const fmt = formats[parseInt(sel.value, 10)];
  if (fmt) selectPrinterFor(fmt.kind || 'label');
}

const state = { align: 'center', decor: 'none', icon_id: '' };
let iconSearchTimer = null;

function extractRuns(root) {
  const runs = [];
  function pushNL() {
    if (runs.length && !runs[runs.length-1].text.endsWith('\n')) {
      runs.push({text: '\n', bold: false, italic: false});
    }
  }
  function walk(node, bold, italic, isFirstBlock) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (node.textContent) runs.push({text: node.textContent, bold, italic});
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName;
    if (tag === 'BR') {
      runs.push({text: '\n', bold, italic});
      return;
    }
    const isBlock = tag === 'DIV' || tag === 'P';
    const cs = node.style || {};
    const fw = (cs.fontWeight || '').toString();
    const fs = (cs.fontStyle || '').toString();
    const isB = bold  || tag === 'B' || tag === 'STRONG' || fw === 'bold' || parseInt(fw,10) >= 600;
    const isI = italic || tag === 'I' || tag === 'EM'    || fs === 'italic';

    if (isBlock && !isFirstBlock) pushNL();
    let firstChildBlock = true;
    for (const child of node.childNodes) {
      walk(child, isB, isI, firstChildBlock);
      firstChildBlock = false;
    }
  }
  let first = true;
  for (const child of root.childNodes) {
    walk(child, false, false, first);
    first = false;
  }
  // Compress adjacent runs with same style
  const out = [];
  for (const r of runs) {
    if (out.length && out[out.length-1].bold === r.bold && out[out.length-1].italic === r.italic) {
      out[out.length-1].text += r.text;
    } else {
      out.push({...r});
    }
  }
  return out;
}

function getPayload() {
  const sliderVal = parseInt($('font_size').value, 10);
  return {
    format: parseInt($('format').value, 10),
    runs: extractRuns($('text')),
    decor: state.decor,
    qr_content: $('qr_content').value,
    icon_id: state.icon_id,
    decor_position: $('decor_position').value,
    align: state.align,
    font_size_pt: sliderVal > 0 ? sliderVal : null,
    line_spacing: parseInt($('line_spacing').value, 10) / 100,
  };
}

function syncFormatButtons() {
  try {
    $('bold_btn').classList.toggle('active', document.queryCommandState('bold'));
    $('italic_btn').classList.toggle('active', document.queryCommandState('italic'));
  } catch (e) {}
}

async function updatePreview() {
  const payload = getPayload();
  const fmt = formats[payload.format];
  $('preview_meta').textContent = fmt.kind === 'tape'
    ? `Nastro ${fmt.width_mm} mm — auto-fit — ${fmt.code}`
    : `${fmt.width_mm} × ${fmt.height_mm} mm — ${fmt.code}`;

  try {
    const res = await fetch('/api/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      console.error('Preview error', res.status);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const img = $('preview');
    const old = img.src;
    img.onload = () => { if (old.startsWith('blob:')) URL.revokeObjectURL(old); };
    img.src = url;
  } catch (e) {
    console.error('Preview fetch failed', e);
  }
}

function schedulePreview() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { updatePreview(); saveDraftLocal(); }, 300);
}

// ── Draft persistence (per-browser localStorage) ────────────────────────
const DRAFT_KEY = 'dymo-web:draft';

function saveDraftLocal() {
  try {
    const draft = {
      text_html:      $('text').innerHTML,
      format:         parseInt($('format').value, 10),
      decor:          state.decor,
      qr_content:     $('qr_content').value,
      icon_id:        state.icon_id,
      decor_position: $('decor_position').value,
      align:          state.align,
      font_size_pt:   parseInt($('font_size').value, 10),
      line_spacing:   parseInt($('line_spacing').value, 10),
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch (e) {}
}

function loadDraftLocal() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (typeof d.format === 'number') {
      $('format').value = d.format;
      const fmt = formats[d.format];
      if (fmt) selectPrinterFor(fmt.kind || 'label');
    }
    $('text').innerHTML = d.text_html || '';
    setDecorMode(d.decor || 'none');
    $('qr_content').value = d.qr_content || '';
    $('decor_position').value = d.decor_position || 'left';
    state.icon_id = d.icon_id || '';
    if (state.icon_id) {
      $('icon_chosen_id').textContent = state.icon_id;
      $('icon_chosen').hidden = false;
    } else {
      $('icon_chosen').hidden = true;
    }
    state.align = d.align || 'center';
    $('align_group').querySelectorAll('.seg').forEach(b =>
      b.classList.toggle('active', b.dataset.align === state.align));
    $('font_size').value = d.font_size_pt || 0;
    syncFontSizeUI();
    const ls = (d.line_spacing != null ? d.line_spacing : 20);
    $('line_spacing').value = ls;
    $('line_spacing_label').textContent = ls + '%';
    return true;
  } catch (e) { return false; }
}

function resetEditor() {
  localStorage.removeItem(DRAFT_KEY);
  $('text').textContent = '';
  setDecorMode('none');
  $('qr_content').value = '';
  state.icon_id = '';
  $('icon_chosen').hidden = true;
  $('decor_position').value = 'left';
  state.align = 'center';
  $('align_group').querySelectorAll('.seg').forEach(b =>
    b.classList.toggle('active', b.dataset.align === 'center'));
  $('font_size').value = 0;
  syncFontSizeUI();
  $('line_spacing').value = 20;
  $('line_spacing_label').textContent = '20%';
  const def = formats.find(f => f.is_default);
  if (def) {
    $('format').value = def.index;
    selectPrinterFor(def.kind || 'label');
  }
  updatePreview();
}

async function doPrint() {
  const btn = $('print_btn');
  const status = $('status');
  status.className = 'status';
  status.textContent = '';

  const payload = getPayload();
  payload.printer_name = $('printer').value;

  if (!payload.printer_name) {
    status.className = 'status err';
    status.textContent = 'Seleziona una stampante.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Stampa in corso...';
  try {
    const res = await fetch('/api/print', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.ok) {
      // Brief visual confirmation on the button itself, no status message
      btn.textContent = 'Stampa ✓';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Stampa'; }, 1800);
      loadHistory();
      return;
    }
    status.className = 'status err';
    status.textContent = data.message || 'Errore di stampa.';
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Errore di rete: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = 'Stampa';
}

// Wire up events
$('format').addEventListener('change', () => {
  const fmt = formats[parseInt($('format').value, 10)];
  if (fmt) selectPrinterFor(fmt.kind || 'label');
  schedulePreview();
});
$('text').addEventListener('input', () => { syncFormatButtons(); schedulePreview(); });
$('text').addEventListener('keyup', syncFormatButtons);
$('text').addEventListener('mouseup', syncFormatButtons);
document.addEventListener('selectionchange', () => {
  if (document.activeElement === $('text')) syncFormatButtons();
});
function setDecorMode(mode) {
  state.decor = mode;
  $('decor_mode').querySelectorAll('.seg').forEach(b =>
    b.classList.toggle('active', b.dataset.decor === mode)
  );
  $('decor_qr').hidden   = mode !== 'qr';
  $('decor_icon').hidden = mode !== 'icon';
  $('decor_position').hidden = mode === 'none';
  schedulePreview();
}
$('decor_mode').querySelectorAll('.seg').forEach(b => {
  b.addEventListener('click', () => setDecorMode(b.dataset.decor));
});
$('qr_content').addEventListener('input', schedulePreview);
$('decor_position').addEventListener('change', schedulePreview);

async function searchIcons(q) {
  const grid = $('icon_results');
  if (!q || q.length < 2) { grid.innerHTML = ''; return; }
  const setFilter = $('icon_set_filter').value;
  const params = new URLSearchParams({ q, limit: '200' });
  if (setFilter) params.set('prefix', setFilter);
  try {
    const res = await fetch('/api/icons/search?' + params);
    const data = await res.json();
    populateSetFilter(data.popular_sets);
    grid.innerHTML = '';
    (data.icons || []).forEach(id => {
      const set = id.split(':', 1)[0];
      const btn = document.createElement('button');
      btn.title = id;
      btn.dataset.iconId = id;
      if (id === state.icon_id) btn.classList.add('selected');
      btn.innerHTML = `
        <img src="https://api.iconify.design/${id}.svg?color=%23000" alt="">
        <div class="set">${set}</div>
      `;
      btn.addEventListener('click', () => {
        state.icon_id = id;
        $('icon_chosen_id').textContent = id;
        $('icon_chosen').hidden = false;
        grid.querySelectorAll('button').forEach(b =>
          b.classList.toggle('selected', b.dataset.iconId === id)
        );
        schedulePreview();
      });
      grid.appendChild(btn);
    });
  } catch (e) {
    grid.innerHTML = '<div style="grid-column:1/-1; color:var(--err); font-size:0.85rem;">Errore ricerca</div>';
  }
}

let setFilterPopulated = false;
function populateSetFilter(popular) {
  if (setFilterPopulated || !popular) return;
  const sel = $('icon_set_filter');
  popular.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  });
  setFilterPopulated = true;
}

$('icon_search').addEventListener('input', () => {
  clearTimeout(iconSearchTimer);
  iconSearchTimer = setTimeout(() => searchIcons($('icon_search').value.trim()), 300);
});
$('icon_set_filter').addEventListener('change', () => searchIcons($('icon_search').value.trim()));
$('print_btn').addEventListener('click', doPrint);
$('reset_btn').addEventListener('click', resetEditor);

async function saveDraft() {
  const btn = $('draft_btn');
  const status = $('status');
  status.className = 'status';
  status.textContent = '';
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Salvataggio...';
  try {
    const res = await fetch('/api/history', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(getPayload()),
    });
    const data = await res.json();
    if (data.ok) {
      btn.textContent = 'Salvato ✓';
      loadHistory();
      setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 1500);
      return;
    }
    status.className = 'status err';
    status.textContent = data.error || 'Errore salvataggio';
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Errore di rete: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = original;
}
$('draft_btn').addEventListener('click', saveDraft);

function applyFormat(cmd) {
  $('text').focus();
  document.execCommand(cmd, false, null);
  syncFormatButtons();
  schedulePreview();
}
$('bold_btn').addEventListener('mousedown', e => e.preventDefault());
$('italic_btn').addEventListener('mousedown', e => e.preventDefault());
$('bold_btn').addEventListener('click', () => applyFormat('bold'));
$('italic_btn').addEventListener('click', () => applyFormat('italic'));
$('align_group').querySelectorAll('.seg').forEach(btn => {
  btn.addEventListener('click', () => {
    state.align = btn.dataset.align;
    $('align_group').querySelectorAll('.seg').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    schedulePreview();
  });
});
function syncFontSizeUI() {
  const v = parseInt($('font_size').value, 10);
  $('font_size_label').textContent = v > 0 ? v + ' pt' : 'Auto';
  $('font_size_reset').disabled = v === 0;
}
$('font_size').addEventListener('input', () => {
  syncFontSizeUI();
  schedulePreview();
});
$('font_size_reset').addEventListener('click', () => {
  $('font_size').value = 0;
  syncFontSizeUI();
  schedulePreview();
});
$('line_spacing').addEventListener('input', () => {
  $('line_spacing_label').textContent = $('line_spacing').value + '%';
  schedulePreview();
});

// ── History ──────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function runsToHtml(runs) {
  if (!runs) return '';
  return runs.map(r => {
    let html = escapeHtml(r.text || '').replace(/\n/g, '<br>');
    if (r.bold)   html = '<b>' + html + '</b>';
    if (r.italic) html = '<i>' + html + '</i>';
    return html;
  }).join('');
}

function applyPayload(payload) {
  if (typeof payload.format === 'number') {
    $('format').value = payload.format;
    const fmt = formats[payload.format];
    if (fmt) selectPrinterFor(fmt.kind || 'label');
  }
  $('text').innerHTML = runsToHtml(payload.runs);
  setDecorMode(payload.decor || 'none');
  $('qr_content').value = payload.qr_content || '';
  $('decor_position').value = payload.decor_position || 'left';
  state.icon_id = payload.icon_id || '';
  if (state.icon_id) {
    $('icon_chosen_id').textContent = state.icon_id;
    $('icon_chosen').hidden = false;
  } else {
    $('icon_chosen').hidden = true;
  }
  state.align = payload.align || 'center';
  $('align_group').querySelectorAll('.seg').forEach(b =>
    b.classList.toggle('active', b.dataset.align === state.align));
  const sz = payload.font_size_pt || 0;
  $('font_size').value = sz;
  syncFontSizeUI();
  const ls = (payload.line_spacing != null ? Math.round(payload.line_spacing * 100) : 20);
  $('line_spacing').value = ls;
  $('line_spacing_label').textContent = ls + '%';
  updatePreview();
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history?limit=8');
    const data = await res.json();
    renderHistory(data.items || []);
  } catch (e) {
    renderHistory([]);
  }
}

function renderHistory(items) {
  const root = $('history_thumbs');
  root.innerHTML = '';
  if (!items.length) {
    root.innerHTML = '<div class="history-empty">Niente da mostrare ancora.</div>';
    return;
  }
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'thumb ' + (it.kind === 'tape' ? 'tape' : 'label');
    div.title = (it.format_name || '') + ' — ' + new Date(it.ts * 1000).toLocaleString();
    div.innerHTML = `
      <img src="data:image/png;base64,${it.thumb_b64}" alt="">
      <div class="thumb-meta">${escapeHtml(it.format_code || '')}</div>
      <button class="thumb-x" title="Rimuovi" aria-label="Rimuovi">×</button>
    `;
    div.addEventListener('click', e => {
      if (e.target.classList.contains('thumb-x')) return;
      applyPayload(it.payload);
    });
    div.querySelector('.thumb-x').addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/history/' + encodeURIComponent(it.id), {method: 'DELETE'});
      loadHistory();
    });
    root.appendChild(div);
  });
}

// Init
(async () => {
  await Promise.all([loadPrinters(), loadFormats()]);
  // Priority: replay from /history (sessionStorage), then localStorage draft,
  // then a friendly default "Test" string.
  const replayId = sessionStorage.getItem('replay_id');
  if (replayId) {
    sessionStorage.removeItem('replay_id');
    try {
      const res = await fetch('/api/history/' + encodeURIComponent(replayId));
      if (res.ok) {
        const item = await res.json();
        applyPayload(item.payload);
        saveDraftLocal();
        loadHistory();
        return;
      }
    } catch (e) {}
  }
  if (!loadDraftLocal()) {
    $('text').textContent = 'Test';
  }
  updatePreview();
  loadHistory();
})();
</script>
