<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione preset — DYMO Label</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --border: #d2d2d7;
    --text: #1d1d1f; --muted: #6e6e73;
    --accent: #0071e3; --accent-hover: #0077ed;
    --ok: #2e7d32; --err: #c62828; --warn: #ed8a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .back-link {
    color: var(--accent); text-decoration: none;
    font-size: 1rem; font-weight: 500;
  }
  .toolbar { margin-bottom: 0.8rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 0.75rem 1rem; margin-bottom: 0.6rem;
  }
  .preset-row {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; gap: 0.75rem;
  }
  .preset-row:hover { color: var(--accent); }
  .preset-name { font-weight: 500; }
  .preset-meta { font-size: 0.85rem; color: var(--muted); }
  .badge {
    background: var(--warn); color: white;
    padding: 0.1rem 0.45rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 500;
  }
  .form { display: none; padding-top: 0.75rem; border-top: 1px solid var(--border); margin-top: 0.75rem; }
  .form.open { display: block; }
  .section-title {
    font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
    color: var(--muted); letter-spacing: 0.04em;
    margin: 0.5rem 0 0.6rem;
  }
  .field { margin-bottom: 0.7rem; }
  .field label {
    display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem;
  }
  .field-row {
    display: flex; align-items: center; gap: 0.6rem;
  }
  .field-row input[type="number"], .field-row input[type="text"], .field-row select {
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 1rem; font-family: inherit;
  }
  .field-row input[type="number"] { width: 6rem; }
  .field-row input[type="text"] { flex: 1; min-width: 0; }
  .field-row input[type="range"] { flex: 1; }
  .field-row .val {
    font-variant-numeric: tabular-nums;
    min-width: 4rem; text-align: right;
  }
  .field-help {
    font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.3;
  }
  .row2 { display: flex; gap: 0.6rem; }
  .row2 > .field { flex: 1; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
  button {
    padding: 0.5rem 0.9rem; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; background: white; color: var(--text);
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--err); }
  button.danger:hover { background: #ffebee; }
  button:hover:not(.primary):not(.danger) { background: #f0f0f3; }
  .status {
    margin-top: 0.5rem; padding: 0.4rem 0.6rem;
    border-radius: 6px; font-size: 0.85rem; display: none;
  }
  .status.ok { display: block; background: #e8f5e9; color: var(--ok); }
  .status.err { display: block; background: #ffebee; color: var(--err); }
</style>
</head>
<body>
<div class="container">
  <h1>
    <a href="/" class="back-link" title="Torna alla home">←</a>
    Preset
  </h1>
  <div class="toolbar">
    <button class="primary" id="btn-add">+ Nuovo preset</button>
  </div>
  <div id="list"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let DEFAULTS = {};
let OVERRIDES = {};
let FORMATS = [];

async function load() {
  const [presetsRes, formatsRes] = await Promise.all([
    fetch('/api/preset_overrides'),
    fetch('/api/formats'),
  ]);
  const data = await presetsRes.json();
  DEFAULTS = data.defaults;
  OVERRIDES = data.overrides;
  FORMATS = await formatsRes.json();
  render();
}

function render(openIndex = -1, openMode = null) {
  const list = $('list');
  list.innerHTML = '';
  FORMATS.forEach((fmt, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const hasOverride = !!OVERRIDES[fmt.name] && Object.keys(OVERRIDES[fmt.name]).length > 0;
    const eff = { ...DEFAULTS, ...(OVERRIDES[fmt.name] || {}) };

    const row = document.createElement('div');
    row.className = 'preset-row';
    row.innerHTML = `
      <div>
        <div class="preset-name">${escapeHtml(fmt.name)}</div>
        <div class="preset-meta">${fmt.kind === 'tape'
          ? `nastro ${fmt.width_mm} mm`
          : `${fmt.width_mm} × ${fmt.height_mm} mm`} — ${escapeHtml(fmt.cups_media || '')}</div>
      </div>
      <div>
        ${hasOverride ? '<span class="badge">modificato</span>' : ''}
        <span style="color: var(--muted); margin-left: 0.5rem;">▾</span>
      </div>
    `;
    card.appendChild(row);

    const form = buildForm(i, fmt, eff, /*isNew*/ false);
    if (i === openIndex) form.classList.add('open');
    card.appendChild(form);
    row.addEventListener('click', () => form.classList.toggle('open'));
    list.appendChild(card);
  });
}

function buildForm(index, fmt, eff, isNew) {
  const form = document.createElement('div');
  form.className = 'form' + (isNew ? ' open' : '');
  form.innerHTML = `
    <div class="section-title">Caratteristiche preset</div>
    <div class="field">
      <label>Nome</label>
      <div class="field-row">
        <input type="text" data-cat="name" value="${escapeAttr(fmt.name || '')}">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Larghezza (mm)</label>
        <div class="field-row">
          <input type="number" data-cat="width_mm" value="${fmt.width_mm ?? ''}" step="0.1" min="1">
        </div>
      </div>
      <div class="field">
        <label>Altezza / Lunghezza min. (mm)</label>
        <div class="field-row">
          <input type="number" data-cat="height_mm" value="${fmt.height_mm ?? ''}" step="0.1" min="1">
        </div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Tipo</label>
        <div class="field-row">
          <select data-cat="kind">
            <option value="label" ${fmt.kind !== 'tape' ? 'selected' : ''}>Etichetta</option>
            <option value="tape"  ${fmt.kind === 'tape' ? 'selected' : ''}>Nastro D1</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Codice (es. 99012, D1-12)</label>
        <div class="field-row">
          <input type="text" data-cat="code" value="${escapeAttr(fmt.code || '')}">
        </div>
      </div>
    </div>
    <div class="field">
      <label>CUPS media</label>
      <div class="field-row">
        <input type="text" data-cat="cups_media" value="${escapeAttr(typeof fmt.cups_media === 'string' ? fmt.cups_media : '')}">
      </div>
      <div class="field-help">
        Nome del formato carta che il driver DYMO conosce. Regola pratica:
        <ul style="margin: 0.3rem 0 0 1rem; padding: 0;">
          <li><b>Etichetta DYMO standard</b>: copia il <code>cups_media</code> da un preset built-in con la stessa misura (es. <code>w162h90</code> per 57×32 mm).</li>
          <li><b>Misura custom</b>: usa <code>Custom.WxHmm</code> coi tuoi mm (es. <code>Custom.40x12mm</code>).</li>
          <li><b>Nastro D1</b>: il valore è quasi simbolico, la pipeline lo sovrascrive runtime con la lunghezza effettiva. Va bene un placeholder tipo <code>w35h4000</code>.</li>
        </ul>
      </div>
    </div>
    <div class="actions">
      <button class="primary" data-action="${isNew ? 'create' : 'save-cat'}">${isNew ? 'Crea preset' : 'Salva caratteristiche'}</button>
      ${isNew
        ? '<button data-action="cancel-new">Annulla</button>'
        : '<button class="danger" data-action="delete-preset">Elimina preset</button>'}
    </div>
    <div class="status status-cat"></div>

    ${isNew ? '' : `
    <div class="section-title" style="margin-top: 1rem;">Aggiustamenti di stampa</div>
    <div class="field">
      <label>Offset X (mm) — sposta a sinistra (negativo) o destra (positivo)</label>
      <div class="field-row">
        <input type="number" data-key="offset_x_mm" value="${eff.offset_x_mm}" step="0.1" min="-5" max="5">
      </div>
    </div>
    <div class="field">
      <label>Offset Y (mm) — sposta in alto (negativo) o basso (positivo)</label>
      <div class="field-row">
        <input type="number" data-key="offset_y_mm" value="${eff.offset_y_mm}" step="0.1" min="-5" max="5">
      </div>
    </div>
    <div class="field">
      <label>Margine auto-fit (% riduzione font)</label>
      <div class="field-row">
        <input type="range" data-key="auto_fit_safety" value="${Math.round(eff.auto_fit_safety * 100)}" min="0" max="50" step="1">
        <span class="val"><span class="val-num">${Math.round(eff.auto_fit_safety * 100)}</span>%</span>
      </div>
      <div class="field-help">0% = font massimo possibile; 10-15% = un po' d'aria; 30-50% = molto più piccolo.</div>
    </div>
    <div class="field">
      <label>Padding interno (mm)</label>
      <div class="field-row">
        <input type="number" data-key="padding_mm" value="${eff.padding_mm}" step="0.5" min="0" max="10">
      </div>
      <div class="field-help">Spazio bianco intorno a testo e decoro.</div>
    </div>
    <div class="actions">
      <button class="primary" data-action="save-overrides">Salva aggiustamenti</button>
      <button class="danger" data-action="reset-overrides">Ripristina default</button>
      <button data-action="print-calibration" title="Stampa pattern di calibrazione">Stampa calibrazione</button>
    </div>
    <div class="field-help" style="margin-top: 0.4rem;">
      Stampa una griglia con croce centrale e righelli mm: misura di quanti mm la croce è fuori centro fisico, somma quel delta agli offset X/Y, ristampa.
    </div>
    <div class="status status-ovr"></div>
    `}
  `;

  // Wire range live label (only for non-new forms)
  const range = form.querySelector('input[type="range"]');
  if (range) {
    range.addEventListener('input', () => {
      form.querySelector('.val-num').textContent = range.value;
    });
  }

  // Action handlers
  form.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      if (action === 'create')          await createPreset(form);
      if (action === 'save-cat')        await saveCatalog(index, fmt, form);
      if (action === 'delete-preset')   await deletePreset(index, fmt, form);
      if (action === 'save-overrides')  await saveOverride(fmt.name, form);
      if (action === 'reset-overrides') await resetOverride(fmt.name, form);
      if (action === 'print-calibration') await printCalibration(index, fmt, form);
      if (action === 'cancel-new')      load();
    });
  });

  // Block toggle when clicking inside the form
  form.addEventListener('click', e => e.stopPropagation());
  return form;
}

function readCatalog(form) {
  const out = {};
  form.querySelectorAll('[data-cat]').forEach(el => {
    const k = el.dataset.cat;
    let v = el.value;
    if (k === 'width_mm' || k === 'height_mm') {
      v = parseFloat(v);
      if (isNaN(v)) v = 0;
    } else {
      v = String(v).trim();
    }
    out[k] = v;
  });
  return out;
}

function readOverrides(form) {
  const out = {};
  form.querySelectorAll('input[data-key]').forEach(el => {
    let v = parseFloat(el.value);
    if (isNaN(v)) v = 0;
    if (el.dataset.key === 'auto_fit_safety') v = v / 100;  // % -> fraction
    out[el.dataset.key] = v;
  });
  return out;
}

async function createPreset(form) {
  const status = form.querySelector('.status-cat');
  status.className = 'status status-cat';
  try {
    const body = readCatalog(form);
    const res = await fetch('/api/presets', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'HTTP ' + res.status);
    await load();
  } catch (e) {
    status.className = 'status status-cat err';
    status.textContent = 'Errore: ' + e.message;
  }
}

async function saveCatalog(index, fmt, form) {
  const status = form.querySelector('.status-cat');
  status.className = 'status status-cat';
  try {
    const body = readCatalog(form);
    const res = await fetch('/api/presets/' + index, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'HTTP ' + res.status);
    await load();
  } catch (e) {
    status.className = 'status status-cat err';
    status.textContent = 'Errore: ' + e.message;
  }
}

async function deletePreset(index, fmt, form) {
  if (!confirm(`Eliminare il preset "${fmt.name}"?\nGli aggiustamenti associati vengono persi.`)) return;
  const status = form.querySelector('.status-cat');
  status.className = 'status status-cat';
  try {
    const res = await fetch('/api/presets/' + index, { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'HTTP ' + res.status);
    await load();
  } catch (e) {
    status.className = 'status status-cat err';
    status.textContent = 'Errore: ' + e.message;
  }
}

async function saveOverride(name, form) {
  const status = form.querySelector('.status-ovr');
  status.className = 'status status-ovr';
  try {
    const body = readOverrides(form);
    const res = await fetch('/api/preset_overrides/' + encodeURIComponent(name), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    OVERRIDES[name] = body;
    status.className = 'status status-ovr ok';
    status.textContent = 'Salvato.';
    render();
  } catch (e) {
    status.className = 'status status-ovr err';
    status.textContent = 'Errore: ' + e.message;
  }
}

async function printCalibration(index, fmt, form) {
  if (!confirm(`Stampare il pattern di calibrazione su "${fmt.name}"?\n\nUserà gli offset attualmente salvati per il preset.`)) return;
  const status = form.querySelector('.status-ovr');
  status.className = 'status status-ovr';
  status.textContent = 'Invio…';
  status.style.display = 'block';
  try {
    const res = await fetch('/api/print_calibration', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({format: index}),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.message || data.error || 'HTTP ' + res.status);
    const o = data.offsets || {};
    const a = o.applied || [0, 0];
    status.className = 'status status-ovr ok';
    status.textContent = `Inviato. Offset applicati: X=${a[0].toFixed(2)} Y=${a[1].toFixed(2)} mm (auto ${(o.auto||[0,0])[1].toFixed(2)} + utente ${(o.user||[0,0])[1].toFixed(2)} su Y).`;
  } catch (e) {
    status.className = 'status status-ovr err';
    status.textContent = 'Errore: ' + e.message;
  }
}

async function resetOverride(name, form) {
  const status = form.querySelector('.status-ovr');
  status.className = 'status status-ovr';
  try {
    const res = await fetch('/api/preset_overrides/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    delete OVERRIDES[name];
    status.className = 'status status-ovr ok';
    status.textContent = 'Ripristinato.';
    render();
  } catch (e) {
    status.className = 'status status-ovr err';
    status.textContent = 'Errore: ' + e.message;
  }
}

function showAddForm() {
  // Insert a temporary "new preset" card at the top of the list
  const list = $('list');
  // If one is already open, focus it instead of stacking
  if (list.firstElementChild && list.firstElementChild.dataset.role === 'new') {
    list.firstElementChild.querySelector('input[data-cat="name"]').focus();
    return;
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.role = 'new';
  const blank = { name: '', width_mm: 50, height_mm: 20, kind: 'label', cups_media: '', code: '' };
  card.appendChild(buildForm(-1, blank, DEFAULTS, /*isNew*/ true));
  list.insertBefore(card, list.firstChild);
  card.querySelector('input[data-cat="name"]').focus();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

$('btn-add').addEventListener('click', showAddForm);
load();
</script>
</body>
</html>
