<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impostazioni — DYMO Label</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --border: #d2d2d7;
    --text: #1d1d1f; --muted: #6e6e73;
    --accent: #0071e3; --accent-hover: #0077ed;
    --ok: #2e7d32; --err: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .back-link {
    color: var(--accent); text-decoration: none;
    font-size: 1rem; font-weight: 500;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; margin-bottom: 1rem;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
  .setting-row { margin-bottom: 1rem; }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-help {
    font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.4;
  }
  .slider-row {
    display: flex; align-items: center; gap: 0.75rem; margin-top: 0.4rem;
  }
  .slider-row input[type="range"] { flex: 1; }
  .slider-val {
    font-variant-numeric: tabular-nums;
    min-width: 3.5rem; text-align: right; color: var(--text);
  }
  button.primary {
    width: 100%; padding: 0.85rem;
    background: var(--accent); color: white;
    border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: var(--muted); cursor: not-allowed; }
  .status {
    margin-top: 0.75rem; padding: 0.6rem 0.8rem;
    border-radius: 8px; font-size: 0.9rem; display: none;
  }
  .status.ok { display: block; background: #e8f5e9; color: var(--ok); }
  .status.err { display: block; background: #ffebee; color: var(--err); }
</style>
</head>
<body>
<div class="container">
  <h1>
    <a href="/" class="back-link" title="Torna alla home">←</a>
    Impostazioni
  </h1>

  <div class="card">
    <div class="setting-row">
      <label for="auto_fit_safety">Margine auto-fit (riduzione font)</label>
      <div class="slider-row">
        <input type="range" id="auto_fit_safety" min="0" max="50" step="1" value="0">
        <span class="slider-val" id="auto_fit_safety_val">0%</span>
      </div>
      <div class="setting-help">
        Quando l'auto-fit del font sembra "troppo grande", aumenta questa percentuale
        per riservare spazio bianco aggiuntivo. <strong>0%</strong> = font massimo possibile;
        <strong>10-15%</strong> = un po' di aria; <strong>30-50%</strong> = font notevolmente più piccolo.
        Si applica a tutti i preset (label e tape).
      </div>
    </div>
  </div>

  <div class="card">
    <button class="primary" id="save_btn">Salva</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function load() {
  const res = await fetch('/api/settings');
  const cfg = await res.json();
  const safety = Math.round((cfg.auto_fit_safety || 0) * 100);
  $('auto_fit_safety').value = safety;
  $('auto_fit_safety_val').textContent = safety + '%';
}

$('auto_fit_safety').addEventListener('input', () => {
  $('auto_fit_safety_val').textContent = $('auto_fit_safety').value + '%';
});

async function save() {
  const status = $('status');
  status.className = 'status';
  status.textContent = '';

  const safety = parseInt($('auto_fit_safety').value, 10) / 100;
  const btn = $('save_btn');
  btn.disabled = true;
  btn.textContent = 'Salvataggio...';
  try {
    const res = await fetch('/api/settings', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ auto_fit_safety: safety }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    status.className = 'status ok';
    status.textContent = 'Impostazioni salvate.';
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Errore: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salva';
  }
}
$('save_btn').addEventListener('click', save);

load();
</script>
</body>
</html>
